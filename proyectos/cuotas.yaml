
apiVersion: v1
kind: ResourceQuota
metadata:
    name: mi-resource-quota
spec:
    hard:
        requests.cpu: "6"
        requests.memory: 10Gi
        limits.cpu: "6"
        limits.memory: 10Gi
---

apiVersion: v1
kind: LimitRange
metadata:
    name: mi-limit-range
spec:
    limits:
    - type: Container
      max:
        cpu: "1"
        memory: 2Gi
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: "1"
        memory: 1Gi
    - type: Pod
      max:
        cpu: "1"
        memory: 2Gi
