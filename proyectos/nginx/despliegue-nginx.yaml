---
# Como se está descargando la imagen de nginx de docker hub... y estamos tratando de desplegarla en OpenShift,
# esto no va a funcionar... La imagen de docker hub usa usuario "root"
# Y por defecto eso a OpenShift no le gusta... y no lo va a permitir...
# Solo por jugar un poco con los security context constraints, vamos a permitir que esta imagen se ejecute con usuario "root"
# En un entorno real... lo que haríamos es buscar una imagen de nginx que no use usuario "root".
# Paso 1: Crear un service account apra este despliegue:
kind:                   ServiceAccount
apiVersion:             v1
metadata:
  name:                 nginx-sa
---
kind:                   Deployment
apiVersion:             apps/v1

metadata:
  name:                 nginx

spec:
  replicas:                 1
  selector:
    matchLabels:
      app:                  nginx
  template:
    metadata:
      labels:
        app:                nginx

    spec:
      serviceAccountName:   nginx-sa       # Paso 2: Uso ese service account en el despliegue de nginx
      containers:
      - name:               nginx
        image:              nginx:latest
        imagePullPolicy:    IfNotPresent
        resources:
          limits:
            memory:         128Mi
            cpu:            250m
          requests:
            memory:         128Mi
            cpu:            250m
      # Paso 3: Permitir que el service account nginx-sa pueda ejecutar contenedores con usuario root
      securityContext:
        runAsUser:         0 # Usuario root
        runAsGroup:        0 # Grupo root
        fsGroup:           0 # Grupo root

# Pero esto no sería suficiente... Necesitas permitir que el service account nginx-sa pueda ejecutar contenedores con usuario root... 
# Para eso, hay que asociar una política de seguridad (security context constraint) que permita eso al service account nginx-sa
# Paso 4: Asociar la política de seguridad "anyuid" al service account nginx
# $ oc adm policy add-scc-to-user anyuid -z nginx-sa -n proyecto-ivan
