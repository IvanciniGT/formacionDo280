---
eck-elasticsearch:
  enabled: true
  fullnameOverride: elasticsearch
  version: 9.4.1

  nodeSets:
  - name: mis-maestros
    count: 3
    config:
      node.roles: ["master","data"]

    podTemplate:
      spec:

        #containers:
        #- name: elasticsearch

        #  resources:
        #    limits:
        #      memory: 2Gi
        #    requests:
        #      memory: 2Gi
        serviceAccountName: elasticsearch
        initContainers:
        - command:
          - sh
          - "-c"
          - sysctl -w vm.max_map_count=262144
          name: sysctl
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false


