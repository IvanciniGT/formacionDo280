apiVersion:                       elasticsearch.k8s.elastic.co/v1
kind:                             Elasticsearch # CRD= Custom Resource Definition
                                                # Un tipo de recurso que no es de la libreria estandar de kubernetes.
                                                # Lo habla/conoce un operador que hemos instalado: Elastic Cloud on Kubernetes (ECK)
metadata:
  name:                           quickstart

spec:

  version:                        9.4.1
  nodeSets:
  - name:                         default
    count:                        1
    config:
      node.store.allow_mmap:      false

